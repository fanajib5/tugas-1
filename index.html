<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SITTA Universitas Terbuka</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-page">
    <article class="login-card">
      <header class="logo-area">
        <div class="logo-content">
          <h2>SITTA - UT</h2>
          <p>Sistem Informasi Tiras dan Transaksi Bahan Ajar</p>
          <p class="subtitle">Universitas Terbuka</p>
        </div>
      </header>

      <section id="alertContainer"></section>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Masukkan email" autocomplete="email" required>
          <small class="error-text" id="emailError"></small>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password" required>
          <small class="error-text" id="passwordError"></small>
        </div>
        <button type="submit" class="btn btn-primary">Masuk</button>
      </form>

      <nav class="form-actions">
        <button type="button" class="btn-link" id="btnLupaPassword">Lupa password?</button>
        <button type="button" class="btn-link" id="btnDaftar">Daftar</button>
      </nav>
    </article>
  </main>

  <section class="modal-overlay" id="modalLupaPassword">
    <article class="modal-box">
      <header class="modal-header">
        <h3>Lupa Password</h3>
        <button type="button" class="modal-close" id="closeLupaPassword">&times;</button>
      </header>
      <p style="color:#666;font-size:0.9rem;margin:1.5rem 0 1.2rem 0;">Masukkan email terdaftar untuk menerima link reset password.</p>
      <form id="formLupaPassword">
        <div class="form-group">
          <label for="emailLupa">Email</label>
          <input type="email" id="emailLupa" placeholder="Masukkan email" required>
          <small class="error-text" id="emailLupaError"></small>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top:0.5rem;">Kirim Link Reset</button>
      </form>
    </article>
  </section>
        <button type="submit" class="btn btn-primary">Kirim Link Reset</button>
      </form>
    </article>
  </section>

  <section class="modal-overlay" id="modalDaftar">
    <article class="modal-box">
      <header class="modal-header">
        <h3>Daftar Akun Baru</h3>
        <button type="button" class="modal-close" id="closeDaftar">&times;</button>
      </header>
      <form id="formDaftar" style="padding-top: 1.5rem;">
        <div class="form-group">
          <label for="namaDaftar">Nama Lengkap</label>
          <input type="text" id="namaDaftar" placeholder="Masukkan nama lengkap" required>
          <small class="error-text" id="namaDaftarError"></small>
        </div>
        <div class="form-group">
          <label for="emailDaftar">Email</label>
          <input type="email" id="emailDaftar" placeholder="Masukkan email" required>
          <small class="error-text" id="emailDaftarError"></small>
        </div>
        <div class="form-group">
          <label for="passwordDaftar">Password</label>
          <input type="password" id="passwordDaftar" placeholder="Buat password (min. 6 karakter)" required>
          <small class="error-text" id="passwordDaftarError"></small>
        </div>
        <div class="form-group">
          <label for="passwordDaftarConfirm">Konfirmasi Password</label>
          <input type="password" id="passwordDaftarConfirm" placeholder="Konfirmasi password" required>
          <small class="error-text" id="passwordDaftarConfirmError"></small>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top:0.5rem;">Daftar</button>
      </form>
    </article>
  </section>

  <footer class="app-footer">
    &copy; 2026 SITTA - Universitas Terbuka
  </footer>

  <script src="js/data.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
