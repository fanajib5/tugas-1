<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SITTA Universitas Terbuka</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="logo-area">
        <div class="logo-icon">�</div>
        <h2>SITTA - UT</h2>
        <p>Sistem Informasi Tiras dan Transaksi Bahan Ajar</p>
        <p>Universitas Terbuka</p>
      </div>

      <div id="alertContainer"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Masukkan email" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
      </form>

      <div class="form-actions">
        <button type="button" class="btn-link" id="btnLupaPassword">Lupa Password?</button>
        <button type="button" class="btn-link" id="btnDaftar">Daftar</button>
      </div>
    </div>
  </div>

  <!-- Modal Lupa Password -->
  <div class="modal-overlay" id="modalLupaPassword">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Lupa Password</h3>
        <button type="button" class="modal-close" id="closeLupaPassword">&times;</button>
      </div>
      <p style="color:#666;font-size:0.9rem;margin-bottom:1rem;">Masukkan email terdaftar untuk menerima link reset password.</p>
      <form id="formLupaPassword">
        <div class="form-group">
          <label for="emailLupa">Email</label>
          <input type="email" id="emailLupa" placeholder="Masukkan email">
        </div>
        <button type="submit" class="btn btn-primary">Kirim Link Reset</button>
      </form>
    </div>
  </div>

  <!-- Modal Daftar -->
  <div class="modal-overlay" id="modalDaftar">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Daftar Akun Baru</h3>
        <button type="button" class="modal-close" id="closeDaftar">&times;</button>
      </div>
      <form id="formDaftar">
        <div class="form-group">
          <label for="namaDaftar">Nama Lengkap</label>
          <input type="text" id="namaDaftar" placeholder="Masukkan nama lengkap">
        </div>
        <div class="form-group">
          <label for="emailDaftar">Email</label>
          <input type="email" id="emailDaftar" placeholder="Masukkan email">
        </div>
        <div class="form-group">
          <label for="passwordDaftar">Password</label>
          <input type="password" id="passwordDaftar" placeholder="Buat password">
        </div>
        <div class="form-group">
          <label for="passwordDaftarConfirm">Konfirmasi Password</label>
          <input type="password" id="passwordDaftarConfirm" placeholder="Konfirmasi password">
        </div>
        <button type="submit" class="btn btn-primary">Daftar</button>
      </form>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
