<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informasi Stok Bahan Ajar - SITTA Universitas Terbuka</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-mode-ready">
  <header>
    <h1><span class="logo-icon">📚</span> Informasi Stok Bahan Ajar</h1>
    <nav class="user-info">
      <span id="displayNama">-</span>
      <button class="btn-icon" id="btnDarkMode" title="Mode Gelap">🌙</button>
      <button class="btn-logout" id="btnLogout">Logout</button>
    </nav>
  </header>

  <main class="container">
    <a href="dashboard.html" class="back-link">&#8592; Kembali ke Dashboard</a>

    <section class="card">
      <h2 class="card-title">Peragaan Data Bahan Ajar</h2>
      <p style="color:#666;margin-bottom:1.5rem;font-size:0.9rem;">Data stok bahan ajar yang tersedia di Universitas Terbuka</p>

      <div id="alertContainer"></div>

      <!-- Search & Filter -->
      <div class="stok-toolbar">
        <input type="text" id="inputCariStok" placeholder="Cari berdasarkan nama/kode barang..." class="search-input">
        <span class="stok-count" id="stokCount">Menampilkan 0 data</span>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <p>&copy; 2026 SITTA - Universitas Terbuka</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/stok.js"></script>
</body>
</html>
