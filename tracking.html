<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracking Pengiriman - SITTA Universitas Terbuka</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-mode-ready">
  <header>
    <h1><span class="logo-icon">📦</span> Tracking Pengiriman</h1>
    <nav class="user-info">
      <span id="displayNama">-</span>
      <button class="btn-icon" id="btnDarkMode" title="Mode Gelap">🌙</button>
      <button class="btn-logout" id="btnLogout">Logout</button>
    </nav>
  </header>

  <main class="container">
    <a href="dashboard.html" class="back-link">&#8592; Kembali ke Dashboard</a>

    <section class="card">
      <h2 class="card-title">Lacak Pengiriman</h2>
      <div class="search-bar">
        <label for="inputNoDO" style="display:flex;align-items:center;font-weight:500;white-space:nowrap;">No. DO/Billing</label>
        <input type="text" id="inputNoDO" placeholder="Contoh: DO-001">
        <button class="btn btn-primary" id="btnCari">Lacak</button>
      </div>
      <div id="alertContainer"></div>
    </section>

    <section class="card tracking-result" id="trackingResult">
      <h2 class="card-title" id="resultTitle">Hasil Pencarian</h2>

      <div class="student-info-card" id="studentInfoCard">
        <div class="student-info-row">
          <span class="info-label">Nama Mahasiswa</span>
          <span class="info-value" id="infoNama"></span>
        </div>
        <div class="student-info-row">
          <span class="info-label">Nomor Identitas</span>
          <span class="info-value" id="infoNik"></span>
        </div>
        <div class="student-info-row">
          <span class="info-label">Tanggal Kirim</span>
          <span class="info-value" id="infoTgl"></span>
        </div>
        <div class="student-info-row">
          <span class="info-label">Status</span>
          <span class="info-value" id="infoStatus"></span>
        </div>
        <div class="student-info-row">
          <span class="info-label">Rute Pengiriman</span>
          <span class="info-value" id="infoRute"></span>
        </div>
      </div>

      <div class="location-arrow" id="locationArrow">
        <span class="location-from" id="locAsal"></span>
        <span class="arrow-symbol">&#8594;</span>
        <span class="location-to" id="locTujuan"></span>
      </div>

      <div class="progress-container">
        <div id="statusBadge" style="margin-bottom:0.5rem;"></div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-labels">
          <span id="label1">Diproses</span>
          <span id="label2">Dikirim</span>
          <span id="label3">Sampai</span>
        </div>
      </div>

      <div class="timeline-container" id="timelineContainer">
        <div class="section-subtitle">Riwayat Perjalanan Paket</div>
        <div class="timeline" id="timeline"></div>
      </div>

      <div class="detail-grid" id="detailGrid"></div>
    </div>
  </main>

  <footer class="app-footer">
    <p>&copy; 2026 SITTA - Universitas Terbuka</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/tracking.js"></script>
</body>
</html>
