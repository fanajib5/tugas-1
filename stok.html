<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informasi Stok Bahan Ajar - SITTA Universitas Terbuka</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1><span class="logo-icon">📚</span> Informasi Stok Bahan Ajar</h1>
    <div class="user-info">
      <span id="displayNama">-</span>
      <button class="btn-logout" id="btnLogout">Logout</button>
    </div>
  </header>

  <div class="container">
    <a href="dashboard.html" class="back-link">&#8592; Kembali ke Dashboard</a>

    <div class="card">
      <div class="card-title">Peragaan Data Bahan Ajar</div>
      <p style="color:#666;margin-bottom:1.5rem;font-size:0.9rem;">Data stok bahan ajar yang tersedia di Universitas Terbuka</p>

      <div id="alertContainer"></div>

      <!-- Form Tambah Baris -->
      <div class="add-stok-form" id="addStokForm">
        <div class="form-group">
          <label for="inputKodeLokasi">Kode Lokasi</label>
          <input type="text" id="inputKodeLokasi" placeholder="Contoh: OTMP06">
        </div>
        <div class="form-group">
          <label for="inputKodeBarang">Kode Barang</label>
          <input type="text" id="inputKodeBarang" placeholder="Contoh: MKDU4112">
        </div>
        <div class="form-group">
          <label for="inputNamaBarang">Nama Barang</label>
          <input type="text" id="inputNamaBarang" placeholder="Nama bahan ajar">
        </div>
        <div class="form-group">
          <label for="inputJenisBarang">Jenis Barang</label>
          <select id="inputJenisBarang">
            <option value="BMP">BMP</option>
            <option value="Modul">Modul</option>
            <option value="Praktikum">Praktikum</option>
          </select>
        </div>
        <div class="form-group">
          <label for="inputEdisi">Edisi</label>
          <input type="number" id="inputEdisi" placeholder="1" min="1">
        </div>
        <div class="form-group">
          <label for="inputStok">Stok</label>
          <input type="number" id="inputStok" placeholder="0" min="0">
        </div>
        <div class="form-group" style="display:flex;gap:0.5rem;align-items:end;">
          <button class="btn btn-success btn-sm" id="btnSimpanStok">Simpan</button>
          <button class="btn btn-secondary btn-sm" id="btnBatalStok">Batal</button>
        </div>
      </div>

      <button class="btn btn-primary btn-sm" id="btnTambahStok" style="margin-bottom:1rem;">+ Tambah Baris Stok Baru</button>

      <!-- Tabel -->
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>Kode Lokasi</th>
              <th>Kode Barang</th>
              <th>Nama Barang</th>
              <th>Jenis Barang</th>
              <th>Edisi</th>
              <th>Stok</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/stok.js"></script>
</body>
</html>
